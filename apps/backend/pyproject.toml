[project]
name = "personae-backend"
version = "0.1.0"
description = "Real-time voice avatar backend"
requires-python = ">=3.13,<3.15"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "uvicorn[standard]>=0.52.4,<0.53",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "websockets>=17.1,<18",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0",
    # Starlette 1.x TestClient requires httpx2; plain httpx raises and errors the suite.
    "httpx2>=2.12.0",
    "mypy>=2.3.1",
    "ruff>=0.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personae"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "PT", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["src", "tests"]
